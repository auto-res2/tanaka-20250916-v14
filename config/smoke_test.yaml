# Minimal config that finishes in a few minutes on one A100
model: "gpt2"
dataset: "jasonkrone/real-toxicity-prompts-10k-sample"
training_args:
  output_dir: "tmp/smoke"
  max_steps: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  save_total_limit: 1
  logging_steps: 1
  eval_strategy: "no"
  dataloader_num_workers: 0
  fp16: false
  gradient_checkpointing: false
  remove_unused_columns: false
laser_hyperparams:
  alpha: 0.05
  M: 4
  tau: 2.0
